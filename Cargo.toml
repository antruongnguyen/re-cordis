[workspace]
members = ["crates/re-cordis-core"]
exclude = ["spikes/m0"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/antruongnguyen/re-cordis"

[workspace.dependencies]
futures-util = { version = "0.3.31", default-features = false, features = ["std", "async-await"] }
tokio = { version = "1.48", default-features = false, features = ["rt", "sync"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
