name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundations:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.85.0"]
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: Check formatting
        if: matrix.toolchain == 'stable'
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path spikes/m0/Cargo.toml --check
      - name: Lint
        if: matrix.toolchain == 'stable'
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy --manifest-path spikes/m0/Cargo.toml --all-targets --locked -- -D warnings
      - name: Check workspace targets
        run: cargo check --workspace --all-targets --locked
      - name: Test workspace and documentation
        run: cargo test --workspace --locked
      # Temporary D1 diagnostic; remove after the collector cause is established.
      - name: Diagnose collector failure (bounded MSRV sample)
        if: always() && matrix.toolchain == '1.85.0'
        run: |
          test_binary=$(cargo test -p re-cordis-core --test github_collect --locked --no-run --message-format=json |
            python3 -c 'import json, sys
          for line in sys.stdin:
              message = json.loads(line)
              if message.get("executable"):
                  print(message["executable"])')
          test -x "$test_binary"
          for attempt in {1..100}; do
            printf 'Collector diagnostic attempt %s/100\n' "$attempt"
            "$test_binary" || exit "$?"
          done
      - name: Preserve M0 evidence
        run: cargo test --manifest-path spikes/m0/Cargo.toml --locked
