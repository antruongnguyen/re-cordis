name: Documentation

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      pages-artifact:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  guides:
    name: Guides (${{ matrix.toolchain }}, macOS)
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.85.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-11-05)
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-11-05)
        if: matrix.toolchain != 'stable'
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - name: Restore locked dependencies and execute guides
        shell: bash
        run: |
          source .github/scripts/rust-tools.sh "${{ matrix.toolchain }}"
          "$CORDIS_CARGO" fetch --locked
          python3 -B .github/scripts/restore-docs-dependencies.py
          python3 -B tests/docs/test_check.py
          python3 -B tests/docs/check.py --toolchain "${{ matrix.toolchain }}"
      - name: Check API documentation feature configurations
        shell: bash
        run: |
          source .github/scripts/rust-tools.sh "${{ matrix.toolchain }}"
          "$CORDIS_CARGO" doc --workspace --all-features --no-deps --locked --offline
          "$CORDIS_CARGO" test -p re-cordis-hmr --doc --features include --locked --offline
          "$CORDIS_CARGO" test -p re-cordis-hmr --doc --no-default-features --locked --offline

      - name: Build the website's exact API artifact on macOS
        if: matrix.toolchain == 'stable'
        shell: bash
        run: |
          source .github/scripts/rust-tools.sh stable
          CARGO_TARGET_DIR="$PWD/target/site-rustdoc" "$CORDIS_CARGO" doc --workspace --all-features --locked --offline
      - name: Share exact API artifact with the static site job
        if: matrix.toolchain == 'stable'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rustdoc-for-website
          path: target/site-rustdoc/doc
          include-hidden-files: true
          retention-days: 1

  site:
    name: Static site (Linux, macOS Rustdoc artifact)
    needs: guides
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rustdoc-for-website
          path: target/site-rustdoc/doc
      - name: Configure Pages metadata (deployment preparation only)
        if: inputs.pages-artifact == true
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Install website dependencies
        working-directory: website
        run: bun install --frozen-lockfile
      - name: Build and verify static artifact
        working-directory: website
        env:
          CORDIS_RUSTDOC_DIR: ../target/site-rustdoc/doc
        run: |
          bun run build
          bun run typecheck
          bun run lint
          bun run check
      - name: Upload Pages artifact
        if: inputs.pages-artifact == true
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/out
      - name: Retain checked preview artifact
        if: inputs.pages-artifact != true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-preview
          path: website/out
          include-hidden-files: true
          retention-days: 7
