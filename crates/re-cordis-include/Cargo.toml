[package]
name = "re-cordis-include"
description = "Bounded file-backed configuration and journals for re-cordis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = ["crates-io"]

[dependencies]
re-cordis-core = { path = "../re-cordis-core", version = "=0.1.0-alpha.1" }
re-cordis-loader = { path = "../re-cordis-loader", version = "=0.1.0-alpha.1" }
futures-util.workspace = true
serde_json = "1"
yaml-rust2 = { version = "0.10", default-features = false }

[dev-dependencies]
tokio = { workspace = true, features = ["macros"] }

[lints]
workspace = true
