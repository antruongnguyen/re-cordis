[package]
name = "re-cordis-core"
description = "Local plugin lifecycle, scoped effects, typed events, and diagnostics for Cordis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
futures-util.workspace = true
tokio.workspace = true

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
hmac = "0.12"
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["service", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "signal", "test-util", "time"] }

[lints]
workspace = true
